name: Release SDK

# 推送 v* 标签后先确认提交已合并到 master，再验证并发布交付包。
# 首发和 Trusted Publisher 配置见 .github/RELEASING.md。
on:
  push:
    tags:
      - 'v*'

# 同一时刻只运行一次发布，保护正在执行的任务。
concurrency:
  group: sdk-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag commit is in master
        shell: bash
        run: |
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/master; then
            echo "::error::Release tag ${GITHUB_REF_NAME} must point to a commit in master. Merge the release PR and tag the commit from master."
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches SDK version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$package_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match SDK package version $package_version"
            exit 1
          fi

      - name: Build and validate delivery packages
        run: pnpm run release:prepare

      - name: 保存已验证交付包
        uses: actions/upload-artifact@v4
        with:
          name: sdk-${{ github.ref_name }}
          path: dist/release/
          if-no-files-found: error
          overwrite: true

      - name: Enable npm Trusted Publishing
        # Trusted Publishing 要求 npm >= 11.5.1。包的授权由 npm 侧验证。
        run: |
          npm install --global npm@^11.5.1
          npm --version
          test -n "$ACTIONS_ID_TOKEN_REQUEST_URL"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN"

      - name: 发布到 npm
        run: pnpm exec tsx scripts/publish-release.ts

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 下载已验证交付包
        uses: actions/download-artifact@v4
        with:
          name: sdk-${{ github.ref_name }}
          path: dist/release/

      - name: 创建 Release 并上传同一批交付文件
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          flags=()
          if [ "$(node -p "JSON.parse(require('fs').readFileSync('dist/release/release.json','utf8')).prerelease")" = "true" ]; then
            flags+=(--prerelease)
          fi
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes "${flags[@]}"
          fi
          gh release upload "$RELEASE_TAG" dist/release/*.tgz dist/release/release.json --clobber
